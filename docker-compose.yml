services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semanticfit}
      POSTGRES_USER: ${POSTGRES_USER:-semanticfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semanticfit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semanticfit} -d ${POSTGRES_DB:-semanticfit}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-semanticfit}:${POSTGRES_PASSWORD:-semanticfit}@postgres:5432/${POSTGRES_DB:-semanticfit}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /workspace/data
      REPORTS_DIR: /workspace/reports
      RERANKER_ENABLED: "false"
      LLM_TIMEOUT_SECONDS: "5"
    volumes:
      - ./data:/workspace/data
      - ./reports:/workspace/reports
      - ./evaluation:/workspace/evaluation:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  hf_cache:
