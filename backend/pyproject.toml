[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticfit"
version = "0.1.0"
description = "Open-source semantic fashion recommendation platform"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Cors>=4.0,<6",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.12,<2",
  "redis>=5.0,<7",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
  "gunicorn>=22,<24",
  "python-dotenv>=1.0,<2",
  "structlog>=24.1,<26",
  "prometheus-client>=0.20,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = [
  "FlagEmbedding>=1.3.5,<2",
  "torch>=2.2,<3",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
semanticfit-ingest = "ingestion.cli:app"
semanticfit-eval = "evaluation.cli:app"
semanticfit-bootstrap = "app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ingestion*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
